name: Trigger Review Pipeline

on:
  push:
    branches:
      - "**"

jobs:
  review-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Governance Review
        run: |
          echo "===== CALLING GOVERNANCE ENGINE ====="

          RESPONSE=$(curl -s -X POST https://gap-analysis.pivotproduct.com/governance/webhook \
            -H "Content-Type: application/json" \
            -H "X-Governance-Secret: ${{ secrets.GOVERNANCE_WEBHOOK_SECRET }}" \
            -d '{
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit_sha": "${{ github.sha }}",
              "author": "${{ github.actor }}"
            }')

          echo "===== GOVERNANCE RESPONSE ====="
          echo "$RESPONSE"
          echo "=============================="